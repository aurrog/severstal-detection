[project]
name = "severstal-detection"
version = "0.1.0"
description = "Steel defect detection service"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "uvicorn",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
]

[dependency-groups]
ml = [
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "onnxscript>=0.7.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]